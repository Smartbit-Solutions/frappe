name: Build and Push Docker Image

on:
  push:
    branches:
      - rebrand-smartbits-lcs
    paths:
      - 'frappe/www/login.html'
      - 'frappe/public/images/**'

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even without changes'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smartbit-solutions/frappe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout frappe repository
        uses: actions/checkout@v4
        with:
          path: frappe
          ref: rebrand-smartbits-lcs

      - name: Checkout frappe_docker repository
        uses: actions/checkout@v4
        with:
          path: frappe_docker
          repository: Smartbit-Solutions/frappe_docker
          ref: smartbit-custom-setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=rebrand-smartbits-lcs
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/smartbit/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_VERSION=version-16
            FRAPPE_PATH=file://./frappe
            FRAPPE_BRANCH=rebrand-smartbits-lcs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Image built and pushed: ${{ steps.meta.outputs.tags }}"
